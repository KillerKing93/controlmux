<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="35%" stop-color="#0b1024" />
      <stop offset="70%" stop-color="#141a38" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>

    <!-- Corner Energy Flares -->
    <radialGradient id="cyan-flare" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="magenta-flare" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#FF0844" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="plasma-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#7F00FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Sci-Fi Hexagonal Honeycomb Pattern -->
    <pattern id="hex-grid" width="40" height="69" patternUnits="userSpaceOnUse">
      <path d="M 40,0 L 20,11.5 L 0,0 L 0,23 L 20,34.5 L 40,23 Z M 0,34.5 L 20,46 L 0,57.5 L 0,69 L 20,69 L 40,69 L 40,57.5 L 20,46 Z" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="glow-subtle-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Cursor Gradients -->
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>

    <linearGradient id="magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="50%" stop-color="#FF4E50" />
      <stop offset="100%" stop-color="#F9D423" />
    </linearGradient>

    <!-- Core Orb Gradient -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
  </defs>

  <!-- LAYER 1: RICH CYBERPUNK BACKGROUND (HEX MESH + CORNER FLARES + PARTICLES + BRACKETS) -->
  <g id="layer-01-background">
    <!-- Square Canvas Base -->
    <rect width="800" height="800" rx="36" fill="url(#bg-grad)" />

    <!-- Corner Energy Flares -->
    <rect width="800" height="800" rx="36" fill="url(#cyan-flare)" />
    <rect width="800" height="800" rx="36" fill="url(#magenta-flare)" />

    <!-- Ambient Plasma Center Glow -->
    <circle cx="400" cy="350" r="270" fill="url(#plasma-glow)" />

    <!-- Hexagonal Sci-Fi Honeycomb Mesh -->
    <rect width="800" height="800" rx="36" fill="url(#hex-grid)" />

    <!-- Tech Grid Overlay -->
    <path d="M 0,160 L 800,160 M 0,320 L 800,320 M 0,480 L 800,480 M 0,640 L 800,640" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    <path d="M 160,0 L 160,800 M 320,0 L 320,800 M 480,0 L 480,800 M 640,0 L 640,800" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />

    <!-- Data Stream Micro-Particles & Target Crosshairs -->
    <g opacity="0.6">
      <circle cx="120" cy="280" r="2.5" fill="#00F2FE" filter="url(#glow-subtle-cyan)" />
      <circle cx="290" cy="470" r="2.5" fill="#00F2FE" />
      <circle cx="680" cy="280" r="2.5" fill="#FF0844" />
      <circle cx="510" cy="470" r="2.5" fill="#FF0844" filter="url(#glow-magenta)" />
      <circle cx="400" cy="170" r="2" fill="#7F00FF" />

      <!-- Micro Target Ticks -->
      <path d="M 140,430 L 150,430 M 145,425 L 145,435" stroke="#00F2FE" stroke-width="1" opacity="0.7" />
      <path d="M 650,430 L 660,430 M 655,425 L 655,435" stroke="#FF0844" stroke-width="1" opacity="0.7" />
      <path d="M 395,120 L 405,120 M 400,115 L 400,125" stroke="#ffffff" stroke-width="1" opacity="0.5" />
    </g>

    <!-- Outer Frame Edge Border -->
    <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="url(#core-grad)" stroke-width="2" stroke-opacity="0.4" />

    <!-- 4 Futuristic Corner Bracket Accents -->
    <path d="M 30,80 L 30,40 A 10,10 0 0,1 40,30 L 80,30" stroke="#00F2FE" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />
    <path d="M 720,30 L 760,30 A 10,10 0 0,1 770,40 L 770,80" stroke="#FF0844" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)" />
    <path d="M 30,720 L 30,760 A 10,10 0 0,0 40,770 L 80,770" stroke="#FF0844" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)" />
    <path d="M 720,770 L 760,770 A 10,10 0 0,0 770,760 L 770,720" stroke="#00F2FE" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />

    <!-- Edge Status LED Indicators -->
    <circle cx="400" cy="30" r="3" fill="#00F2FE" filter="url(#glow-cyan)" />
    <circle cx="400" cy="770" r="3" fill="#FF0844" filter="url(#glow-magenta)" />
    <circle cx="30" cy="400" r="3" fill="#7F00FF" />
    <circle cx="770" cy="400" r="3" fill="#7F00FF" />
  </g>

  <!-- LAYER 2: HIGH-TECH CABLES ATTACHED DIRECTLY TO THE BOTTOM OF THE MOUSE CURSORS -->
  <g id="layer-02-circuit-core">
    <!-- Outer Orbital Energy Rings -->
    <circle cx="400" cy="350" r="140" fill="none" stroke="url(#core-grad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 8" />
    <circle cx="400" cy="350" r="95" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6" />

    <!-- CYAN CABLE ATTACHED DIRECTLY TO BOTTOM OF PERSON 1 MOUSE AT (270,390) -->
    <path d="M 270,390 C 310,405 340,375 362,350" stroke="#00F2FE" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />
    <path d="M 270,390 C 310,405 340,375 362,350" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.85" />
    <circle cx="270" cy="390" r="5" fill="#00F2FE" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-cyan)" />

    <!-- Floating Cyan Data Packets -->
    <circle cx="310" cy="392" r="4.5" fill="#00F2FE" filter="url(#glow-cyan)" />
    <circle cx="342" cy="368" r="4.5" fill="#ffffff" filter="url(#glow-cyan)" />
    <!-- Data Stream Label Tag -->
    <text x="250" y="428" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="800" fill="#00F2FE" filter="url(#glow-subtle-cyan)">DATA CH_1 ▶</text>

    <!-- MAGENTA CABLE ATTACHED DIRECTLY TO BOTTOM OF PERSON 2 MOUSE AT (530,390) -->
    <path d="M 530,390 C 490,405 460,375 438,350" stroke="#FF0844" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-magenta)" />
    <path d="M 530,390 C 490,405 460,375 438,350" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.85" />
    <circle cx="530" cy="390" r="5" fill="#FF0844" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-magenta)" />

    <!-- Floating Magenta Data Packets -->
    <circle cx="490" cy="392" r="4.5" fill="#FF0844" filter="url(#glow-magenta)" />
    <circle cx="458" cy="368" r="4.5" fill="#ffffff" filter="url(#glow-magenta)" />
    <!-- Data Stream Label Tag -->
    <text x="480" y="428" font-family="'Segoe UI', monospace" font-size="9.5" font-weight="800" fill="#FF0844">◀ DATA CH_2</text>

    <!-- Central Multiplexer Reactor Housing -->
    <circle cx="400" cy="350" r="38" fill="#0c1024" stroke="url(#core-grad)" stroke-width="3.5" filter="url(#glow-cyan)" />
    <circle cx="400" cy="350" r="18" fill="#00F2FE" filter="url(#glow-cyan)" />
  </g>

  <!-- LAYER 3: PERSON 1 CYAN CURSOR -->
  <g id="layer-03-cyan-cursor" filter="url(#drop-shadow)">
    <!-- Cyan Cursor Geometry (Bottom Stem at 270,390) -->
    <g filter="url(#glow-cyan)">
      <polygon points="180,260 205,380 225,350 260,400 280,380 245,330 285,330" fill="url(#cyan-grad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      <polyline points="186,270 206,365 220,342" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" fill="none" />
    </g>

    <!-- Glassmorphic Name Badge Container -->
    <g>
      <rect x="95" y="185" width="140" height="42" rx="10" fill="#071222" fill-opacity="0.95" stroke="#00F2FE" stroke-width="2" />
      <circle cx="118" cy="206" r="6" fill="#00F2FE" filter="url(#glow-cyan)" />
      <text x="176" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">PERSON 1</text>
    </g>
  </g>

  <!-- LAYER 4: PERSON 2 MAGENTA CURSOR -->
  <g id="layer-04-magenta-cursor" filter="url(#drop-shadow)">
    <!-- Magenta Cursor Geometry (Bottom Stem at 530,390) -->
    <g filter="url(#glow-magenta)">
      <polygon points="620,260 595,380 575,350 540,400 520,380 555,330 515,330" fill="url(#magenta-grad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      <polyline points="614,270 594,365 580,342" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" fill="none" />
    </g>

    <!-- Glassmorphic Name Badge Container -->
    <g>
      <rect x="565" y="185" width="140" height="42" rx="10" fill="#240712" fill-opacity="0.95" stroke="#FF0844" stroke-width="2" />
      <circle cx="588" cy="206" r="6" fill="#FF0844" filter="url(#glow-magenta)" />
      <text x="646" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">PERSON 2</text>
    </g>
  </g>

  <!-- LAYER 5: TYPOGRAPHY & BRANDING -->
  <g id="layer-05-typography" filter="url(#drop-shadow)">
    <!-- Title Text with subtle cyan neon glow on MUX -->
    <text x="400" y="620" font-family="'Segoe UI', 'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">
      CONTROL<tspan fill="#00F2FE" filter="url(#glow-subtle-cyan)">MUX</tspan>
    </text>

    <!-- Subtitle Pill Tag -->
    <rect x="220" y="650" width="360" height="32" rx="16" fill="#0c1024" stroke="url(#core-grad)" stroke-width="1.5" />
    <text x="400" y="671" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">
      MULTI-PERSON INPUT CONTROL ENGINE
    </text>

    <!-- Author Attribution -->
    <text x="400" y="718" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b" text-anchor="middle">
      BY ALIF NURHIDAYAT
    </text>
  </g>
</svg>
