<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="glow-subtle-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
  </defs>
  <!-- LAYER 5: TYPOGRAPHY, BRANDING & TECH BUILD BADGE -->
  <g id="layer-05-typography" filter="url(#drop-shadow)">
    <text x="400" y="618" font-family="'Segoe UI', 'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">
      CONTROL<tspan fill="#00F2FE" filter="url(#glow-subtle-cyan)">MUX</tspan>
    </text>
    <rect x="220" y="648" width="360" height="32" rx="16" fill="#0c1024" stroke="url(#core-grad)" stroke-width="1.5" />
    <text x="400" y="669" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" letter-spacing="2" fill="#e2e8f0" text-anchor="middle">
      MULTI-PERSON INPUT CONTROL ENGINE
    </text>
    <text x="400" y="712" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5" fill="#64748b" text-anchor="middle">
      BY ALIF NURHIDAYAT
    </text>
    <g>
      <rect x="310" y="736" width="180" height="24" rx="12" fill="#080c1a" stroke="#00F2FE" stroke-width="1.2" stroke-opacity="0.7" />
      <text x="400" y="752" font-family="'Segoe UI', Roboto, monospace" font-size="9.5" font-weight="800" letter-spacing="1.5" fill="#00F2FE" text-anchor="middle">v1.0.0 NATIVE C++17</text>
    </g>
  </g>
</svg>
