<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" /><feMerge><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-magenta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" /><feMerge><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>
  </defs>
  <!-- LAYER 2: HIGH-TECH CABLES ATTACHED DIRECTLY TO THE BOTTOM OF THE MOUSE CURSORS -->
  <g id="layer-02-circuit-core">
    <circle cx="400" cy="350" r="140" fill="none" stroke="url(#core-grad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="12 8" />
    <circle cx="400" cy="350" r="95" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6" />

    <!-- CYAN CABLE ATTACHED TO BOTTOM OF PERSON 1 MOUSE (FROM 270,390 TO CORE AT 362,350) -->
    <path d="M 270,390 C 310,405 340,375 362,350" stroke="#00F2FE" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />
    <path d="M 270,390 C 310,405 340,375 362,350" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.85" />
    <circle cx="270" cy="390" r="5" fill="#00F2FE" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-cyan)" />

    <!-- MAGENTA CABLE ATTACHED TO BOTTOM OF PERSON 2 MOUSE (FROM 530,390 TO CORE AT 438,350) -->
    <path d="M 530,390 C 490,405 460,375 438,350" stroke="#FF0844" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#glow-magenta)" />
    <path d="M 530,390 C 490,405 460,375 438,350" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="6 6" fill="none" opacity="0.85" />
    <circle cx="530" cy="390" r="5" fill="#FF0844" stroke="#ffffff" stroke-width="1.5" filter="url(#glow-magenta)" />

    <!-- Central Multiplexer Reactor Housing -->
    <circle cx="400" cy="350" r="38" fill="#0c1024" stroke="url(#core-grad)" stroke-width="3.5" filter="url(#glow-cyan)" />
    <circle cx="400" cy="350" r="18" fill="#00F2FE" filter="url(#glow-cyan)" />
  </g>
</svg>
