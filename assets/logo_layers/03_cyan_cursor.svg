<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" /><feMerge><feMergeNode in="blur1" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="drop-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.85" />
    </filter>
    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
  </defs>
  <!-- LAYER 3: PERSON 1 CYAN CURSOR, CLICK RIPPLE RINGS & MINI KEYBOARD ICON -->
  <g id="layer-03-cyan-cursor" filter="url(#drop-shadow)">
    <circle cx="180" cy="260" r="22" fill="none" stroke="#00F2FE" stroke-width="2" stroke-dasharray="4 4" opacity="0.85" filter="url(#glow-cyan)" />
    <circle cx="180" cy="260" r="36" fill="none" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.45" filter="url(#glow-cyan)" />
    <g filter="url(#glow-cyan)">
      <polygon points="180,260 205,380 225,350 260,400 280,380 245,330 285,330" fill="url(#cyan-grad)" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" />
      <polyline points="186,270 206,365 220,342" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.7" fill="none" />
    </g>
    <g>
      <rect x="95" y="185" width="140" height="42" rx="10" fill="#071222" fill-opacity="0.95" stroke="#00F2FE" stroke-width="2" />
      <circle cx="118" cy="206" r="6" fill="#00F2FE" filter="url(#glow-cyan)" />
      <text x="176" y="211" font-family="'Segoe UI', Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.5" fill="#ffffff" text-anchor="middle">PERSON 1</text>
    </g>
    <g transform="translate(100, 138)">
      <rect width="32" height="20" rx="4" fill="#0c1024" stroke="#00F2FE" stroke-width="1.5" />
      <rect x="4" y="4" width="4" height="3" rx="1" fill="#00F2FE" />
      <rect x="10" y="4" width="4" height="3" rx="1" fill="#00F2FE" />
      <rect x="16" y="4" width="4" height="3" rx="1" fill="#00F2FE" />
      <rect x="22" y="4" width="6" height="3" rx="1" fill="#00F2FE" />
      <rect x="4" y="9" width="4" height="3" rx="1" fill="#ffffff" opacity="0.8" />
      <rect x="10" y="9" width="4" height="3" rx="1" fill="#ffffff" opacity="0.8" />
      <rect x="16" y="9" width="4" height="3" rx="1" fill="#ffffff" opacity="0.8" />
      <rect x="22" y="9" width="6" height="3" rx="1" fill="#00F2FE" />
      <rect x="8" y="14" width="16" height="3" rx="1" fill="#00F2FE" />
    </g>
  </g>
</svg>
