<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="magenta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0844" />
      <stop offset="100%" stop-color="#FFB199" />
    </linearGradient>
  </defs>
  <!-- LAYER 4: PERSON 2 MAGENTA CURSOR -->
  <g id="layer-04-magenta-cursor" filter="url(#glow-magenta)">
    <polygon points="590,120 565,220 545,195 515,235 500,220 530,180 495,180" fill="url(#magenta-grad)" stroke="#ffffff" stroke-width="2" />
    <rect x="560" y="100" width="70" height="22" rx="4" fill="#250914" stroke="#FF0844" stroke-width="1.5" />
    <text x="595" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#FF0844" text-anchor="middle">PERSON 2</text>
  </g>
</svg>
