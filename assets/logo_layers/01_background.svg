<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050711" />
      <stop offset="35%" stop-color="#0b1024" />
      <stop offset="70%" stop-color="#141a38" />
      <stop offset="100%" stop-color="#030408" />
    </linearGradient>

    <radialGradient id="cyan-flare" cx="15%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="magenta-flare" cx="85%" cy="15%" r="45%">
      <stop offset="0%" stop-color="#FF0844" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <pattern id="hex-grid" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40,0 L 20,11.547 L 0,0 L 0,23.094 L 20,34.641 L 40,23.094 Z M 0,34.641 L 20,46.188 L 0,57.735 L 0,80.829 L 20,92.376 L 40,80.829 L 40,57.735 L 20,46.188 Z" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" />
    </pattern>

    <filter id="glow-subtle-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" /><feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge><feMergeNode in="blur1" /><feMergeNode in="blur2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="glow-magenta" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" /><feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge><feMergeNode in="blur1" /><feMergeNode in="blur2" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#7F00FF" />
      <stop offset="100%" stop-color="#FF0844" />
    </linearGradient>

    <radialGradient id="plasma-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#7F00FF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- LAYER 1: ENHANCED BACKGROUND -->
  <g id="layer-01-background">
    <rect width="800" height="800" rx="36" fill="url(#bg-grad)" />
    <rect width="800" height="800" rx="36" fill="url(#cyan-flare)" />
    <rect width="800" height="800" rx="36" fill="url(#magenta-flare)" />
    <circle cx="400" cy="350" r="280" fill="url(#plasma-glow)" />
    <rect width="800" height="800" rx="36" fill="url(#hex-grid)" />
    <path d="M 0,160 L 800,160 M 0,320 L 800,320 M 0,480 L 800,480 M 0,640 L 800,640" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    <path d="M 160,0 L 160,800 M 320,0 L 320,800 M 480,0 L 480,800 M 640,0 L 640,800" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    <g opacity="0.5">
      <circle cx="120" cy="280" r="2" fill="#00F2FE" filter="url(#glow-subtle-cyan)" />
      <circle cx="280" cy="460" r="2.5" fill="#00F2FE" />
      <circle cx="680" cy="280" r="2" fill="#FF0844" />
      <circle cx="520" cy="460" r="2.5" fill="#FF0844" filter="url(#glow-magenta)" />
      <circle cx="400" cy="180" r="2" fill="#7F00FF" />
      <path d="M 140,420 L 150,420 M 145,415 L 145,425" stroke="#00F2FE" stroke-width="1" opacity="0.6" />
      <path d="M 650,420 L 660,420 M 655,415 L 655,425" stroke="#FF0844" stroke-width="1" opacity="0.6" />
      <path d="M 395,120 L 400,120 M 400,115 L 400,125" stroke="#ffffff" stroke-width="1" opacity="0.4" />
    </g>
    <rect x="24" y="24" width="752" height="752" rx="28" fill="none" stroke="url(#core-grad)" stroke-width="2" stroke-opacity="0.4" />
    <path d="M 30,80 L 30,40 A 10,10 0 0,1 40,30 L 80,30" stroke="#00F2FE" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />
    <path d="M 720,30 L 760,30 A 10,10 0 0,1 770,40 L 770,80" stroke="#FF0844" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)" />
    <path d="M 30,720 L 30,760 A 10,10 0 0,0 40,770 L 80,770" stroke="#FF0844" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-magenta)" />
    <path d="M 720,770 L 760,770 A 10,10 0 0,0 770,760 L 770,720" stroke="#00F2FE" stroke-width="3.5" fill="none" stroke-linecap="round" filter="url(#glow-cyan)" />
    <circle cx="400" cy="30" r="3" fill="#00F2FE" filter="url(#glow-cyan)" />
    <circle cx="400" cy="770" r="3" fill="#FF0844" filter="url(#glow-magenta)" />
    <circle cx="30" cy="400" r="3" fill="#7F00FF" />
    <circle cx="770" cy="400" r="3" fill="#7F00FF" />
  </g>
</svg>
